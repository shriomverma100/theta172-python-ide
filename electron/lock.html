<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Python by THETA172</title>
<style>
  :root {
    --bg: #070505; --raise: #0f0b0a; --line: #261c1a; --line-hi: #4d3632;
    --fg: #f4ede9; --dim: #a3948f; --red: #E3262D;
    --display: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    --body: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Consolas', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; padding: 48px 24px;
    background: var(--bg); color: var(--fg); font-family: var(--body);
    -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
    overflow: hidden;
  }
  .lock { width: min(540px, 100%); text-align: center; animation: rise 700ms cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .mark { width: 72px; height: auto; margin: 0 auto 28px; display: block; }
  .brand { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); margin-bottom: 40px; }
  .brand b { color: var(--fg); font-weight: 600; }
  h1 { margin: 0 0 16px; font: 300 32px/1.25 var(--display); letter-spacing: -.01em; }
  .msg { margin: 0 auto 28px; max-width: 42ch; font-size: 16px; line-height: 1.65; color: var(--dim); white-space: pre-wrap; }
  .rule { width: 56px; height: 1px; margin: 0 auto 28px; background: var(--line-hi); }
  .contact { font-size: 15px; color: var(--fg); margin: 0 0 40px; }
  .contact a { color: var(--red); text-decoration: none; }
  .foot { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .managed { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--line-hi); }
  .id { font: 11px var(--mono); color: #3a2d2a; user-select: text; }
  .glow { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(34vmax 26vmax at 50% 42%, rgba(227,38,45,.08), transparent 70%); }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="lock" role="alert">
    <svg class="mark" viewBox="0 0 208 183" aria-hidden="true">
      <g fill="#E3262D">
        <rect x="0" y="60" width="134" height="40"/><rect x="51" y="100" width="48" height="83"/>
        <rect x="134" y="100" width="35" height="83"/><rect x="141" y="35" width="26" height="26"/>
        <rect x="173" y="0" width="35" height="34"/>
      </g>
    </svg>
    <p class="brand">Python <b>by THETA172</b></p>
    <h1 id="title">This copy is currently turned off</h1>
    <p class="msg" id="msg">Access to Python by THETA172 on this computer has been paused by the owner. It will work again once access is restored.</p>
    <div class="rule"></div>
    <p class="contact" id="contact" hidden></p>
    <div class="foot">
      <span class="managed">Managed by THETA172</span>
      <span class="id" id="id"></span>
    </div>
  </main>
</body>
</html>
