name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: No secrets in build output
        run: |
          if grep -rE "gsk_[A-Za-z0-9]{20,}" src dist electron; then
            echo "::error::An API key was found in the source or build output"
            exit 1
          fi
